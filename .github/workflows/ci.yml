name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install shapely pytest
          pytest -q -m "not gui"

      - name: Linting
        if: ${{ always() }}
        run: |
          pip install pylint
          pylint src/ --fail-under=0 --exit-zero

      - name: Type-checking
        if: ${{ always() }}
        run: |
          pip install mypy
          python tools/run_mypy_ci.py

      - name: Bandit Security Analysis
        if: ${{ always() }}
        run: |
          pip install bandit
          bandit -r src/ --severity-level medium
