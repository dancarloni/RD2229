name: CI – Test non-GUI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (no GUI)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run non-GUI tests
        run: |
          python -m pytest -m "not gui and not slow" -q --tb=short

      - name: Run step5 and reporting tests explicitly
        run: |
          python -m pytest tests/test_step5_adapter_smoke.py tests/test_reporting_smoke.py tests/test_pipeline_smoke.py tests/test_project_roundtrip.py -v
