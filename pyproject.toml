[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rd2229"
version = "0.1.0"
description = "Structural engineering calculations including RD 2229/1939 methods"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

[project.optional-dependencies]
gui = ["PyQt6>=6.4", "PyYAML>=6.0"]

[project.scripts]
rd2229 = "src.cli:main"
rd2229-gui = "src.ui.modern.app:main"
structcalc = "src.ui.app:main"
rd2229-demo = "src.rd2229.cli:main"

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Core: F (pyflakes), E/W (pycodestyle), I (isort), N (naming), UP (pyupgrade)
select = ["F", "E", "W", "I", "N", "UP"]
# Evita conflitti con Black e preferenze comuni
ignore = ["E203", "N803", "N806", "E501", "N815", "N802"]

[tool.ruff.lint.per-file-ignores]
# Test files: allow long lines and mixed-case test method names
"tests*/**/*.py" = ["E501", "N802", "E402", "F821"]
"tests/*.py" = ["E501", "N802", "E402", "F821"]
# __init__.py files: allow imports not at top (for re-exports)
"*/__init__.py" = ["E402"]
# Script files: allow imports after sys.path manipulation
"scripts/**/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
# Debug/utility scripts: allow single-line statements
"debug_*.py" = ["E702", "E701", "E722", "E402"]
"tools/debug_*.py" = ["E701", "E722", "E702", "E402"]
# Legacy/duplicated section_calculations files
"sections_app/**/*.py" = ["E402", "F823"]
"softw_components/**/*.py" = ["E402", "F823"]
"apps/sections/section_calculations.py" = ["E402", "F823"]
# Root-level app entry
"__main__.py" = ["E402"]
# Legacy Tkinter app - many style issues inherited from old codebase
"verification_table.py" = ["E741", "F811", "E402"]
# Secondary element module: uses intentional redefinition pattern
"src/codes/ntc2018/secondary_elements/checks.py" = ["E402", "F811"]
"src/codes/ntc2018/secondary_elements/models.py" = ["F811"]
# UI modules: PySide6 imports kept for re-export / future use
"src/ui/modern/**/*.py" = ["F401"]
"src/rd2229/ui_qt/app.py" = ["F401"]
# Legacy UI shim: non-standard import alias is intentional
"src/ui/ui/verification_table_app.py" = ["N812"]

[tool.ruff.format]
# Usi Black come formatter principale → lascia il formatter di Ruff disattivo (default)

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".venv", "build", "dist", ".git"]

[tool.pylint.main]
py-version = "3.11"
# Evita rumore su pattern legacy e allineati al tuo file (broad-exception, protected-access ecc.)
disable = [
  "C0114", "C0115", "C0116",            # docstring mancanti per moduli/classi/funzioni
  "R0903",                              # troppe poche public methods (data classes)
  "R0801",                              # codice duplicato (utile ma spesso rumoroso)
  "W1514",                              # open() senza encoding esplicito
  "E0401",                              # import error (in CI lo intercettiamo con pytest)
  "W0511",                              # TODO/FIXME
  "W0718",                              # broad-exception-caught (necessario per UI robusta)
  "W0212",                              # protected-access (necessario per test e UI patterns)
  "W0108",                              # unnecessary-lambda (pattern comune in UI)
  "C0415",                              # import-outside-toplevel (caricamento dinamico moduli)
  "R0901",                              # too-many-ancestors (ereditarietà Tkinter)
  "R0913", "R0917",                     # too-many-arguments/positional (metodi UI)
  "R0914", "R0915",                     # too-many-locals/statements (metodi complessi UI)
  "R0902"                               # too-many-instance-attributes (classi UI complesse)
]
max-line-length = 100
jobs = 0
load-plugins = []

[tool.mypy]
ignore_missing_imports = false
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
# Exclude local duplicate module that collides with top-level package name
# This avoids "Duplicate module named \"app\"" during local mypy runs.
exclude = '(^|/)(softw_components/app_module/app\\.py)$'

[tool.bandit]
skips = ["B101"]

[tool.pytest.ini_options]
minversion = "7.0"
# extra options from pytest.ini are merged here; keep -q and ignore legacy tests
addopts = "-q --ignore=tests_legacy -ra --strict-markers --disable-warnings"
# only run tests under `tests/`; legacy folder is excluded via addopts
testpaths = ["tests"]
pythonpath = [".", "src"]
# markers defined both in pytest.ini and earlier here; keep all to avoid missing names
markers = [
  "ui: mark tests as UI tests requiring tkinter",
  "slow: mark tests as slow (skip in CI by default)",
  "gui: tests che richiedono ambiente grafico (usare xvfb in CI)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.pip-tools]
generate-hashes = true
annotate-index = true

[tool.pre-commit]
repos = [
    { repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.5.0", hooks = [
        { id = "trailing-whitespace" },
        { id = "end-of-file-fixer" },
        { id = "check-yaml" },
        { id = "check-added-large-files" },
    ]},
    { repo = "https://github.com/psf/black", rev = "23.12.1", hooks = [
      { id = "black", args = ["--line-length", "100"] },
    ]},
    { repo = "https://github.com/pycqa/isort", rev = "5.13.2", hooks = [
      { id = "isort", args = ["--profile", "black", "--line-length", "100"] },
    ]},
    { repo = "https://github.com/charliermarsh/ruff-pre-commit", rev = "v0.1.14", hooks = [
        { id = "ruff", args = ["--fix", "--show-fixes"] },
        { id = "ruff-format" },
    ]},
    { repo = "https://github.com/pre-commit/mirrors-mypy", rev = "v1.8.0", hooks = [
        { id = "mypy", args = ["--config-file", "pyproject.toml"] },
    ]},
]

[tool.setuptools.packages.find]
include = ["src*","src.*"]
