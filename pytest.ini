[pytest]
# Only run tests in `tests/` by default; ignore legacy archived tests in `tests_legacy/`.
addopts = -q --ignore=tests_legacy --ignore=tests/legacy_tkinter --ignore=tests/legacy_qt -ra --disable-warnings
testpaths = tests
python_files = test_*.py
markers =
    ui: mark tests as UI tests requiring tkinter
    slow: mark tests as slow (skip in CI by default)
    gui: tests che richiedono ambiente grafico (usare xvfb in CI)
