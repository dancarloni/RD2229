[pytest]
# Only run tests in `tests/` by default; ignore legacy archived tests in `tests_legacy/`.
addopts = -q --ignore=tests_legacy
testpaths = tests
pythonpath = . src
python_files = test_*.py
markers =
    ui: mark tests as UI tests requiring tkinter
    gui: mark tests as GUI tests requiring tkinter (alias)
    slow: mark tests as slow (skip in CI by default)
