[mypy]
# Allow missing third-party packages / non-typed internal modules to avoid noisy import errors
ignore_missing_imports = True
# Temporarily relax strictness to allow incremental fixes via automation
disallow_untyped_defs = False
no_implicit_optional = True
warn_redundant_casts = True
warn_return_any = True
# Use explicit_package_bases so that src/ is the package root (avoids duplicate-module errors)
explicit_package_bases = True
# Treat namespace packages in a permissive way to avoid duplicate-module conflicts locally
namespace_packages = True
# Exclude the top-level local 'io' package and repository root folder to avoid duplicate-module mapping locally
exclude = ^(RD2229/|io/|src/io/)

[mypy-src.ui.*]
ignore_errors = True

[mypy-src.methods.protocols]
ignore_errors = True

[mypy-src.io.*]
ignore_errors = True
[mypy-io.*]
ignore_errors = True

# Ignore external/legacy packages that are not present in 'src' to keep CI-focused checks clean
[mypy-sections_app.*]
ignore_errors = True

[mypy-app.*]
ignore_errors = True

[mypy-apps.*]
ignore_errors = True

[mypy-core_models.*]
ignore_errors = True

[mypy-tools.*]
ignore_errors = True

[mypy-verification_project]
ignore_errors = True

[mypy-verification_items_repository]
ignore_errors = True

[mypy-historical_materials]
ignore_errors = True

[mypy-material_sources]
ignore_errors = True

[mypy-historical_ta.*]
